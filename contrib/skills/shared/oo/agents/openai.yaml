interface:
  display_name: oo
  short_description: Map hosted tasks to the right oo capability
  default_prompt: "Use $oo as a hosted capability router when the user wants an existing oo package, managed AI pipeline, connector action, or short read-transform-write workflow across connected services. Bind the user's outcome to a minimum viable capability contract before execution: search the current external step, select the most direct candidate, inspect package metadata or connector schema, build the smallest sufficient payload, execute through oo, follow task/file lifecycle, and report the result or named blocker. A good direct first result is enough; keep at most one fallback and use it only when the primary path hits a named blocker the fallback avoids without changing intent. Keep claims grounded in oo output, metadata, connector schema, and task snapshots; do not invent callable ids, schema fields, artifact URLs, or results. Remote capability execution stays inside oo. Upload only for URI-compatible inputs, download only explicit artifact URLs, and treat browse links, edit links, console pages, and metadata as non-artifacts. For non-destructive send, post, create, or invite actions, explicit user intent plus complete required payload values is enough to proceed; ask one focused question before destructive, broad sharing, or ambiguous effect choices."

policy:
  allow_implicit_invocation: true
