interface:
  display_name: oo
  short_description: Map hosted tasks to the right oo capability
  default_prompt: "Use $oo as a hosted capability router when the user wants an existing oo package, managed AI pipeline, connector action, or short read-transform-write workflow across connected services. Bind the user's outcome to a proven capability contract before execution: search the current external step, select the most direct candidate, inspect package metadata or connector schema, build the smallest sufficient payload, execute through oo, follow task/file lifecycle, and report the result or named blocker. Keep claims grounded in oo output, metadata, schema files, and task snapshots; do not invent callable ids, schema fields, artifact URLs, or results. Remote capability execution stays inside oo. Upload only for URI-compatible inputs, download only explicit artifact URLs, and treat browse links, edit links, console pages, and metadata as non-artifacts. For externally visible or destructive actions, proceed only when intent and required values are unambiguous; otherwise ask one focused question or confirmation."

policy:
  allow_implicit_invocation: true
