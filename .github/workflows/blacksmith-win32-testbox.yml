name: Blacksmith Win32 Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: Testbox session ID
        required: true
  pull_request:
    paths:
      - ".github/workflows/**"
permissions:
  contents: read
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --frozen-lockfile
      - name: Run Testbox
        uses: useblacksmith/run-testbox@v2
        if: always()
